<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#071018" />
  <title>乐宝 · 智能饮品抓取</title>
  <style>
    :root {
      --bg: #071018;
      --panel: rgba(15, 29, 40, .82);
      --panel-2: rgba(18, 38, 51, .94);
      --line: rgba(149, 194, 217, .16);
      --text: #f5fbff;
      --muted: #91a7b5;
      --cyan: #52e2df;
      --cyan-2: #1aaebc;
      --blue: #368dff;
      --green: #53e6a1;
      --red: #ff6f73;
      --amber: #ffc65c;
      --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 20%, rgba(23, 143, 156, .16), transparent 34%),
        radial-gradient(circle at 92% 92%, rgba(42, 103, 178, .14), transparent 35%),
        linear-gradient(135deg, #050b10, #09151e 54%, #071018);
      user-select: none;
    }

    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22;
      background-image: linear-gradient(rgba(111, 190, 210, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(111, 190, 210, .07) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    button { font: inherit; color: inherit; }
    .app { height: 100%; min-height: 560px; max-width: 1440px; margin: auto; padding: 26px 34px 22px; display: flex; flex-direction: column; position: relative; z-index: 1; }

    header { height: 58px; display: flex; align-items: flex-start; justify-content: space-between; flex: 0 0 auto; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 38px; height: 38px; border: 0; border-radius: 11px; display: grid; place-items: center; cursor: pointer; background: linear-gradient(145deg, var(--cyan), #218de7); box-shadow: 0 0 24px rgba(82, 226, 223, .3); transition: .18s ease; }
    .brand-mark:active { transform: scale(.94); }
    .brand-mark.active { box-shadow: 0 0 0 4px rgba(82,226,223,.14), 0 0 28px rgba(82,226,223,.48); }
    .brand-mark svg { width: 22px; }
    .brand strong { display: block; font-size: 19px; letter-spacing: .08em; }
    .brand span { display: block; color: var(--muted); font-size: 11px; letter-spacing: .17em; margin-top: 3px; }
    .system { display: flex; gap: 9px; align-items: center; color: #b5c6d0; font-size: 12px; padding-top: 7px; }
    .pill { display: flex; align-items: center; gap: 7px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(10, 21, 30, .62); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }

    main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(380px, .94fr) minmax(560px, 1.45fr); gap: 26px; padding: 24px 0 17px; }
    .voice-panel, .catalog { border: 1px solid var(--line); border-radius: 24px; background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(22px); }
    .voice-panel { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; }
    .voice-panel::after { content: ""; position: absolute; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(82, 226, 223, .12), transparent 68%); pointer-events: none; }
    .eyebrow { color: var(--cyan); font-size: 12px; font-weight: 700; letter-spacing: .2em; margin-bottom: 14px; position: relative; z-index: 2; }
    .voice-title { font-size: clamp(27px, 2.5vw, 38px); line-height: 1.25; margin: 0; position: relative; z-index: 2; }
    .voice-subtitle { color: var(--muted); font-size: 15px; margin: 12px 0 27px; position: relative; z-index: 2; }
    .wake-word { color: #e8ffff; font-weight: 700; }

    .mic { width: 112px; height: 112px; border: 1px solid rgba(104, 241, 237, .35); border-radius: 50%; display: grid; place-items: center; cursor: pointer; position: relative; z-index: 2; background: linear-gradient(145deg, rgba(54, 141, 255, .22), rgba(82, 226, 223, .15)); box-shadow: inset 0 0 30px rgba(82, 226, 223, .1), 0 0 36px rgba(57, 199, 207, .15); transition: transform .18s ease, border-color .18s ease; }
    .mic:active { transform: scale(.95); }
    .mic svg { width: 37px; height: 37px; }
    .mic::before, .mic::after { content: ""; position: absolute; inset: -13px; border: 1px solid rgba(82, 226, 223, .16); border-radius: 50%; }
    .mic::after { inset: -27px; opacity: .45; }
    .mic.listening::before, .mic.listening::after { animation: ripple 1.5s ease-out infinite; }
    .mic.listening::after { animation-delay: .65s; }
    @keyframes ripple { 0% { transform: scale(.82); opacity: .8; } 100% { transform: scale(1.25); opacity: 0; } }
    .wave { height: 34px; display: flex; align-items: center; gap: 4px; margin-top: 25px; position: relative; z-index: 2; }
    .wave i { width: 4px; height: 7px; border-radius: 4px; background: var(--cyan); opacity: .35; }
    .wave.active i { animation: wave .8s ease-in-out infinite alternate; opacity: .9; }
    .wave i:nth-child(2), .wave i:nth-child(8) { animation-delay: -.25s; }
    .wave i:nth-child(3), .wave i:nth-child(7) { animation-delay: -.5s; }
    .wave i:nth-child(4), .wave i:nth-child(6) { animation-delay: -.7s; }
    @keyframes wave { from { height: 7px; } to { height: 30px; } }

    .catalog { padding: 26px 28px; display: flex; flex-direction: column; min-height: 0; }
    .section-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
    .section-head h2 { margin: 0; font-size: 22px; }
    .section-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .touch-tag { color: var(--cyan); font-size: 12px; border: 1px solid rgba(82,226,223,.24); background: rgba(82,226,223,.07); padding: 7px 10px; border-radius: 8px; }
    .cards { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .drink { border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(160deg, rgba(28, 49, 62, .9), rgba(11, 24, 33, .9)); padding: 18px 15px 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 0; transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .drink:hover { border-color: rgba(82, 226, 223, .42); transform: translateY(-3px); background: linear-gradient(160deg, rgba(32, 59, 73, .94), rgba(13, 30, 40, .94)); }
    .drink:active { transform: scale(.97); }
    .product-art { flex: 1; width: 100%; min-height: 150px; display: grid; place-items: center; position: relative; }
    .product-art::before { content: ""; position: absolute; width: 120px; height: 60px; bottom: 6px; border-radius: 50%; filter: blur(18px); opacity: .26; }
    .cola .product-art::before { background: #f34343; }
    .beer .product-art::before { background: #f6b83d; }
    .water .product-art::before { background: #48a9ff; }
    .product-art svg { height: min(24vh, 205px); width: 125px; position: relative; z-index: 1; filter: drop-shadow(0 15px 13px rgba(0,0,0,.3)); }
    .product-art .product-photo { height: min(24vh, 205px); width: 132px; position: relative; z-index: 1; object-fit: cover; object-position: 50% 54%; border-radius: 11px; filter: drop-shadow(0 15px 13px rgba(0,0,0,.3)); }
    .product-art > * { display: none !important; }
    .product-art::after { content: ""; height: min(24vh, 205px); width: 140px; position: relative; z-index: 1; border-radius: 11px; background-color: #fff; background-repeat: no-repeat; background-position: center; background-size: contain; filter: drop-shadow(0 15px 13px rgba(0,0,0,.3)); }

    .drink p { color: var(--muted); margin: 0; font-size: 12px; }
    .select-hint { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); color: #b9ccd7; font-size: 12px; }

    footer { height: 32px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; color: #637b8a; font-size: 11px; letter-spacing: .05em; }
    .demo-fail { color: #6c8797; background: transparent; border: 0; cursor: pointer; padding: 7px; }

    .grip-debug { position: fixed; top: 76px; left: 34px; z-index: 12; display: flex; align-items: flex-start; gap: 10px; }
    .grip-toggle { width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgba(82,226,223,.24); background: rgba(11,27,37,.94); color: var(--cyan); display: grid; place-items: center; cursor: pointer; box-shadow: 0 12px 30px rgba(0,0,0,.28); transition: .18s ease; }
    .grip-toggle:active { transform: scale(.95); }
    .grip-toggle.active { background: linear-gradient(145deg, rgba(26,174,188,.32), rgba(54,141,255,.26)); border-color: rgba(82,226,223,.5); }
    .grip-toggle svg { width: 25px; height: 25px; }
    .grip-panel { width: 280px; padding: 15px 17px 16px; border: 1px solid rgba(82,226,223,.2); border-radius: 15px; background: rgba(11,27,37,.96); box-shadow: 0 18px 45px rgba(0,0,0,.38); opacity: 0; visibility: hidden; transform: translateX(-8px) scale(.98); transform-origin: left top; transition: .18s ease; }
    .grip-panel.show { opacity: 1; visibility: visible; transform: translateX(0) scale(1); }
    .grip-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .grip-head strong { font-size: 14px; }
    .grip-value { min-width: 46px; padding: 4px 8px; border-radius: 8px; color: var(--cyan); background: rgba(82,226,223,.1); text-align: center; font-size: 13px; font-weight: 700; }
    .grip-range { width: 100%; height: 6px; margin: 5px 0 0; appearance: none; border-radius: 999px; outline: 0; background: linear-gradient(90deg, var(--cyan) 0 49.5%, rgba(121,163,183,.2) 49.5% 100%); cursor: pointer; }
    .grip-range::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #eaffff; border: 5px solid var(--cyan-2); box-shadow: 0 3px 12px rgba(0,0,0,.4); }
    .grip-scale { display: flex; justify-content: space-between; margin-top: 8px; color: #617b8a; font-size: 10px; }
    .grip-confirm { width: 100%; min-height: 40px; margin-top: 12px; border: 0; border-radius: 10px; color: white; background: linear-gradient(110deg, var(--cyan-2), #277be6); font-weight: 700; cursor: pointer; }
    .grip-confirm:active { transform: scale(.98); }

    .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; background: rgba(3, 9, 13, .76); backdrop-filter: blur(10px); opacity: 0; visibility: hidden; transition: .2s ease; }
    .overlay.show { opacity: 1; visibility: visible; }
    .modal { width: min(510px, 90vw); border: 1px solid rgba(121, 181, 208, .22); border-radius: 25px; background: linear-gradient(145deg, #142733, #0b1821); padding: 32px; box-shadow: 0 30px 100px rgba(0,0,0,.52); text-align: center; transform: translateY(12px) scale(.98); transition: .22s ease; }
    .overlay.show .modal { transform: translateY(0) scale(1); }
    .modal-icon { width: 68px; height: 68px; margin: 0 auto 18px; border-radius: 20px; display: grid; place-items: center; background: rgba(82,226,223,.1); color: var(--cyan); border: 1px solid rgba(82,226,223,.18); }
    .modal-icon svg { width: 34px; }
    .modal h2 { margin: 0; font-size: 26px; }
    .modal p { color: var(--muted); margin: 10px 0 24px; }
    .target-name { color: var(--cyan); font-weight: 700; }
    .actions { display: grid; grid-template-columns: 1fr 1.5fr; gap: 12px; }
    .btn { min-height: 53px; border-radius: 13px; border: 1px solid var(--line); cursor: pointer; font-weight: 700; }
    .btn-secondary { background: rgba(255,255,255,.035); color: #b8c9d3; }
    .btn-primary { border-color: transparent; background: linear-gradient(110deg, var(--cyan-2), #277be6); box-shadow: 0 10px 26px rgba(35,148,190,.23); }

    .process { width: min(620px, 92vw); }
    .process .modal { width: 100%; }
    .spinner { width: 72px; height: 72px; margin: 0 auto 20px; border: 3px solid rgba(82,226,223,.12); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 24px; }
    .step { color: #58707e; font-size: 12px; padding-top: 13px; border-top: 2px solid rgba(124,163,183,.13); transition: .3s; }
    .step.active { color: var(--cyan); border-color: var(--cyan); }
    .step.done { color: var(--green); border-color: var(--green); }

    .result .modal-icon { border-radius: 50%; }
    .result.success .modal-icon { color: var(--green); background: rgba(83,230,161,.1); border-color: rgba(83,230,161,.22); }
    .result.fail .modal-icon { color: var(--red); background: rgba(255,111,115,.1); border-color: rgba(255,111,115,.22); }
    .countdown { color: #66808f; font-size: 12px; margin-top: 20px; }

    @media (max-width: 900px) {
      .app { padding: 18px; }
      main { grid-template-columns: .8fr 1.5fr; gap: 14px; padding-top: 15px; }
      .voice-panel { padding: 18px; }
      .catalog { padding: 20px; }
      .product-art svg { width: 96px; }
      .voice-title { font-size: 26px; }
    }
  </style>
</head>

  <div class="overlay" id="confirmOverlay">
    <div class="modal">
      <div class="modal-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M8 3h8l1 4H7l1-4ZM7 7h10l1 14H6L7 7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 11h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>

  <div class="overlay process" id="processOverlay">
    <div class="modal">
      <div class="spinner"></div><div class="eyebrow">机械臂执行中</div>
      <h2 id="processTitle">正在识别目标</h2><p id="processText">视觉系统正在定位<span class="target-name">可乐</span></p>
      <div class="steps"><div class="step active">01 · 指令解析</div><div class="step">02 · 视觉定位</div><div class="step">03 · 执行抓取</div></div>

  <div class="overlay result success" id="resultOverlay">
    <div class="modal">
      <div class="modal-icon" id="resultIcon"><svg viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.3 4.3L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="eyebrow" id="resultLabel">任务完成</div><h2 id="resultTitle">抓取完成</h2>
      <p id="resultText"><span class="target-name">可乐</span>已成功送达，请取用</p>
      <div class="actions"><button class="btn btn-secondary" id="backBtn">返回首页</button><button class="btn btn-primary" id="takeBtn">取货</button></div><div class="countdown" id="countdown">5 秒后自动返回</div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const drinks = ['可乐', '啤酒', '矿泉水'];
    let selected = '可乐', timers = [], returnTimer, gripOpening = 50;
    const clearTimers = () => { timers.forEach(clearTimeout); timers = []; clearInterval(returnTimer); };
    const show = el => el.classList.add('show');
    const hide = el => el.classList.remove('show');

    function resetVoice() {
      $('#stateLabel').textContent = '';
      $('#voiceTitle').textContent = '需要什么饮品？';
      $('#voiceSubtitle').innerHTML = '请说 <span class="wake-word">“你好乐宝”</span>';
      $('#micBtn').classList.remove('listening'); $('#wave').classList.remove('active');
    }

    function openConfirm(name) {
      selected = name; $('#targetName').textContent = name;
      $$('#confirmOverlay .target-name').forEach(e => e.textContent = name);
      show($('#confirmOverlay'));
    }

    function startListening() {
      if ($('#micBtn').classList.contains('listening')) return;
      clearTimers(); $('#micBtn').classList.add('listening'); $('#wave').classList.add('active');
      $('#stateLabel').textContent = '聆听中'; $('#voiceTitle').textContent = '正在聆听…';
      $('#voiceSubtitle').textContent = '请说出您想要的饮品';
      timers.push(setTimeout(() => {
        selected = drinks[Math.floor(Math.random() * drinks.length)];
        $('#voiceTitle').textContent = `“帮我拿一瓶${selected}”`;
        $('#voiceSubtitle').textContent = '已识别语音指令'; $('#stateLabel').textContent = '已识别';
        $('#micBtn').classList.remove('listening'); $('#wave').classList.remove('active');
        timers.push(setTimeout(() => executeGrab(false), 700));
      }, 2300));
    }

    function executeGrab(shouldFail = false) {
      hide($('#confirmOverlay')); show($('#processOverlay'));
      const steps = $$('#processOverlay .step');
      steps.forEach((s,i) => { s.className = 'step' + (i === 0 ? ' active' : ''); });
      $('#processTitle').textContent = '正在解析指令';
      $('#processText').innerHTML = `已锁定抓取目标：<span class="target-name">${selected}</span>`;
      timers.push(setTimeout(() => { steps[0].className='step done'; steps[1].className='step active'; $('#processTitle').textContent='正在识别目标'; $('#processText').innerHTML=`视觉系统正在定位<span class="target-name">${selected}</span>`; }, 950));
      timers.push(setTimeout(() => { steps[1].className='step done'; steps[2].className='step active'; $('#processTitle').textContent='机械臂抓取中'; $('#processText').textContent='目标已定位，正在规划并执行抓取动作'; }, 2100));
      timers.push(setTimeout(() => { hide($('#processOverlay')); showResult(shouldFail); }, 3700));
    }

    function showResult(fail) {
      const overlay = $('#resultOverlay');
      overlay.classList.toggle('success', !fail); overlay.classList.toggle('fail', fail);
      $('#resultLabel').textContent = fail ? '任务中断' : '任务完成';
      $('#resultTitle').textContent = fail ? '未找到目标饮品' : '抓取完成';
      $('#resultText').innerHTML = fail ? `视觉区域内暂未识别到<span class="target-name">${selected}</span>，请检查摆放位置` : `<span class="target-name">${selected}</span>已成功送达，请取用`;
      $('#resultIcon').innerHTML = fail ? '<svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5m0 3.5v.1M4.5 19h15L12 5 4.5 19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<svg viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.3 4.3L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      show(overlay); let n = 5; $('#countdown').textContent = `${n} 秒后自动返回`;
      returnTimer = setInterval(() => { n--; $('#countdown').textContent = `${n} 秒后自动返回`; if (n <= 0) backHome(); }, 1000);
    }

    function backHome() { clearTimers(); hide($('#confirmOverlay')); hide($('#processOverlay')); hide($('#resultOverlay')); resetVoice(); }
    $$('.drink').forEach(card => card.addEventListener('click', () => openConfirm(card.dataset.drink)));
    $('#micBtn').addEventListener('click', startListening);
    $('#cancelBtn').addEventListener('click', () => { hide($('#confirmOverlay')); resetVoice(); });
    $('#confirmBtn').addEventListener('click', () => executeGrab(false));
    $('#backBtn').addEventListener('click', backHome);
    $('#takeBtn').addEventListener('click', backHome);
    $('#gripToggle').addEventListener('click', () => {
      const open = $('#gripPanel').classList.toggle('show');
      $('#gripToggle').classList.toggle('active', open);
      $('#gripToggle').setAttribute('aria-label', open ? '关闭假抓调试' : '打开假抓调试');
    });
    $('#gripRange').addEventListener('input', e => {
      const value = e.target.value;
      $('#gripValue').textContent = value;
      $('#gripConfirm').textContent = '确认设置';
      e.target.style.background = `linear-gradient(90deg, var(--cyan) 0 ${(value - 1) / 99 * 100}%, rgba(121,163,183,.2) ${(value - 1) / 99 * 100}% 100%)`;
    });
    $('#gripConfirm').addEventListener('click', () => {
      gripOpening = Number($('#gripRange').value);
      $('#gripConfirm').textContent = `已确认：${gripOpening}`;
      timers.push(setTimeout(() => {
        $('#gripPanel').classList.remove('show');
        $('#gripToggle').classList.remove('active');
        $('#gripToggle').setAttribute('aria-label', '打开假抓调试');
        $('#gripConfirm').textContent = '确认设置';
      }, 500));
    });
    $('#failBtn').addEventListener('click', () => { selected = drinks[Math.floor(Math.random()*drinks.length)]; executeGrab(true); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') backHome(); if (e.key.toLowerCase() === 'v') startListening(); });
  </script>
</body>
</html>
